name: Bug report
description: Something in the template does not build, deploy or behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include instance URLs with credentials, passwords, tokens or customer data.
        Security issues: use a private report instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste error output.
    validations:
      required: true
  - type: input
    id: template-version
    attributes:
      label: Template version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: SDK version (npx now-sdk --version)
      placeholder: 4.13.6
  - type: input
    id: instance-release
    attributes:
      label: Instance release and patch
      placeholder: Brazil Patch 0
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent (if relevant)
      options: [None, Claude Code, Codex, Pi, Copilot, Cursor, Other]
