# Weekly dependency updates. Nothing auto-merges: an SDK bump can change keys.ts and
# instance behaviour, so each update needs a build and a test-instance check (RELEASING.md).
# Every update waits out a cooldown (supply-chain baseline, 2026-10-20): 7 days, and 14 for
# a semver-major npm bump. github-actions keeps the SHA pins and their "# vX.Y.Z" comments.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      servicenow:
        patterns: ['@servicenow/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'globals']
    ignore:
      # The SDK's UI page guide pins React 18.2.0; move only when the SDK does.
      - dependency-name: react
      - dependency-name: react-dom

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
