name: Release

# Runs when a GitHub Release is published (gh release create vX.Y.Z ...; see RELEASING.md).
# Verifies the tag matches package.json, builds with frozen keys, and attaches the
# packaged app with a signed build-provenance attestation.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload release assets
      id-token: write # sign the attestation (Sigstore)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # A release cut from the wrong commit, or a missed version bump, would otherwise
      # ship an app whose sys_app version disagrees with its tag.
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG != package.json $version. Was the release cut from the right commit?"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build:ci
      - run: npm run pack

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/*.zip

      - name: Upload the packaged app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" target/*.zip --repo "$GITHUB_REPOSITORY" --clobber
