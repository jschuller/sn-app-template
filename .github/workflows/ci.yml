name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supply-chain baseline (homelab-governance, 2026-10-20): actions pinned by commit SHA, checkouts keep no
# token, npm installs from the lockfile with install scripts off (the SDK builds without them). The workflow
# grants nothing; each job asks for exactly what it needs.
permissions: {}

# Superseded pull-request runs are cancelled; runs on main always finish. CI never touches an instance:
# deploy and ATF run from the developer's machine (README → "CI").
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      # Runs scripts/setup.mjs on temporary copies of the checkout (tests/setup.test.mjs).
      - name: Test
        run: npm test

      - name: Agent skills are in sync (.agents/skills -> .claude/skills)
        run: npm run sync:skills -- --check

      # --frozenKeys fails when src/fluent/generated/keys.ts is missing a key, so a
      # build that would mint new sys_ids on every machine never reaches main.
      - name: Build (frozen keys)
        run: npm run build:ci

      - name: Package
        run: npm run pack

  # Security audit of the workflows and dependabot.yml (config: .github/zizmor.yml). The Action
  # runs zizmor's container image by version and digest; results go to the log, not to code scanning.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.30.1"
          advanced-security: false
